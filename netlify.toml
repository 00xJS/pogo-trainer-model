[build]
  # 100% static — the regression, percentiles and every chart are computed
  # client-side from site/data/trainers.json. No build step, no server.
  # Regenerate the data file with: node tools/build-dataset.mjs
  publish = "site"
  command = ""

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
