[build]
  # 100% static — the regression, percentiles and every chart are computed
  # client-side from site/data/trainers.json. No build step, no server.
  # site/data/trainers.json is a committed build artifact; its generator is kept
  # local and is deliberately not part of this repository.
  publish = "site"
  command = ""

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
